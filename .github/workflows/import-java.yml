name: Replace with Java experiment
on:
  push:
    paths:
      - '.trigger-import'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with ex9
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          api="https://api.github.com/repos/rassika06/visitingcard/contents"
          zip_url="$(curl -fsSL "$api" | jq -r '[.[] | select(.type=="file" and (.name | endswith(".zip")))][0].download_url')"
          if [ -z "$zip_url" ] || [ "$zip_url" = "null" ]; then
            echo "No ZIP file found in rassika06/visitingcard root"
            exit 1
          fi
          curl -fL "$zip_url" -o "$tmp/source.zip"
          unzip -q "$tmp/source.zip" -d "$tmp/unpacked"
          src="$tmp/unpacked/mad lab/ex9"
          if [ ! -d "$src" ]; then
            echo "Expected folder not found: mad lab/ex9"
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$src"/. .
          rm -f .trigger-import
          rm -f .github/workflows/import-java.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace with Java experiment 9"
          git push
